<div class="container-fluid">
  <div class="row py-5">
    <div class="d-flex justify-content-between">
      <h2>Add new staff</h2>
      <button class="ms-auto" mat-raised-button color="primary" (click)="add()">
        Add <mat-icon>add_circle_outline</mat-icon>
      </button>
    </div>
  </div>
  <div class="d-flex justify-content-end row">
    <mat-form-field>
      <mat-label>Filter</mat-label>
      <input
        matInput
        (keyup)="applyFilter($event)"
        placeholder="Search"
        #input
      />
    </mat-form-field>
  </div>
  <div class="mat-elevation-z8 py-5">
    <table
      mat-table
      [dataSource]="dataSource"
      matSort
      matSortActive="created"
      matSortDisableClear
      matSortDirection="desc"
    >
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let element" class="text-capitalize">
          {{ element.name }}
        </td>
      </ng-container>
      <!-- Land Line Column -->
      <ng-container matColumnDef="land_line">
        <th mat-header-cell *matHeaderCellDef>Land Line</th>
        <td mat-cell *matCellDef="let element">{{ element.land_line }}</td>
      </ng-container>
      <ng-container matColumnDef="pay_rate">
        <th mat-header-cell *matHeaderCellDef>Pay Rate</th>
        <td mat-cell *matCellDef="let element">{{ element.pay_rate }}</td>
      </ng-container>
      <!-- mobileColumn -->
      <ng-container matColumnDef="subcontractor">
        <th mat-header-cell *matHeaderCellDef>Subcontractor</th>
        <td mat-cell *matCellDef="let element">{{ element.subcontractor }}</td>
      </ng-container>
      <!-- Data actions -->
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>Action</th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button (click)="edit(element)">
            <mat-icon>create</mat-icon>
          </button>
          <button mat-icon-button (click)="delete(element.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <!-- Table columns and rows -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    <mat-paginator
      [length]="resultsLength"
      [pageSizeOptions]="[25, 75, 100]"
      aria-label="Select page of results"
    ></mat-paginator>
  </div>
</div>
