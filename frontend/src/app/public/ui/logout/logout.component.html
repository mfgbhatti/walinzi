<div class="container">
  <div class="row py-5 d-flex justify-content-center">
    <div class="col-6 py-5">
      <mat-card class="mat-elevation-z8">
        <mat-card-header>
          <mat-card-title>Sign out</mat-card-title>
          <mat-card-subtitle
            >You have been logged out successfully.</mat-card-subtitle
          >
        </mat-card-header>
        <mat-card-content>
          <p>Redirecting in {{ countdown | i18nPlural : countdownMapping }}</p>
          <!-- Redirect message -->
          @if (countdown === 0) {
          <ng-container> You are now being redirected! </ng-container>}
          <mat-divider></mat-divider>
        </mat-card-content>
        <mat-card-actions>
          <span>Go to &nbsp;</span>
          <a [routerLink]="['/sign-in']">sign in </a>
        </mat-card-actions>
        <mat-card-footer>
          <mat-progress-bar mode="indeterminate"></mat-progress-bar>
        </mat-card-footer>
      </mat-card>
    </div>
  </div>
</div>
