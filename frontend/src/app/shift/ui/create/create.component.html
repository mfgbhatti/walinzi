<div class="container">
  <form [formGroup]="form" class="row py-5">
    <div class="d-flex justify-content-between">
      <div class="col-8">
        <mat-form-field>
          <mat-label>Choose a date</mat-label>
          <input
            matInput
            [matDatepicker]="datepicker"
            formControlName="time_in"
            required
          />
          <!-- <mat-hint>DD/MM/YYYY</mat-hint> -->
          <mat-datepicker-toggle
            matIconSuffix
            [for]="datepicker"
          ></mat-datepicker-toggle>
          <mat-datepicker #datepicker>
            <!-- <mat-datepicker-actions>
            <button mat-button matDatepickerCancel>Cancel</button>
            <button mat-raised-button color="primary" matDatepickerApply>Apply</button>
          </mat-datepicker-actions> -->
          </mat-datepicker>
        </mat-form-field>
      </div>
      <div class="col-4 ps-2">
        <div class="d-flex justify-content-between">
          <mat-form-field>
            <mat-label>Start time</mat-label>
            <input
              matInput
              required
              formControlName="start_time"
              placeholder="00:00"
              type="time"
            />
          </mat-form-field>
          <mat-form-field class="ps-2">
            <mat-label>End time</mat-label>
            <input
              matInput
              required
              formControlName="end_time"
              placeholder="00:00"
              type="time"
            />
          </mat-form-field>
        </div>
      </div>
    </div>
    <div class="d-flex justify-content-between">
      <div class="col-4">
        <div class="d-flex justify-content-between">
          <mat-form-field>
            <mat-label>Break</mat-label>
            <input matInput formControlName="break_duration" type="number" />
          </mat-form-field>
          <mat-form-field class="ps-2">
            <mat-label>Duration</mat-label>
            <input
              matInput
              [readonly]="true"
              formControlName="duration"
              type="time"
            />
          </mat-form-field>
        </div>
      </div>
      <div class="col-8 ps-2">
        <mat-form-field>
          <mat-label>Repeat shift</mat-label>
          <mat-select>
            <mat-option>Clear</mat-option>
            <mat-option value="valid">Valid option</mat-option>
            <mat-option value="invalid">Invalid option</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>
    <mat-form-field>
      <mat-label>Location</mat-label>
      <mat-select formControlName="location">
        @for (location of locations$ | async; track location) {
        <mat-option [value]="location.id">{{ location.name | titlecase }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <mat-form-field>
      <mat-label>Staff</mat-label>
      <mat-select formControlName="staff" multiple>
        @for (guard of guards$ | async; track guard) {
        <mat-option [value]="guard.id">{{
          guard.display_name | titlecase
        }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <div class="d-flex justify-content-end">
      <button
        type="button"
        mat-raised-button
        (click)="submit()"
        color="primary"
        class="btn submit col-3"
        [disabled]="!this.form.valid"
      >
        Submit
      </button>
      <button
        type="button"
        mat-raised-button
        (click)="close()"
        color="accent"
        class="btn submit col-3 ms-4"
      >
        Close
      </button>
    </div>
  </form>
</div>
