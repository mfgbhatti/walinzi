<div class="container-fluid">
  <div class="row py-5">
    <div class="d-flex justify-content-between">
      <h2>Add new user</h2>
      <button class="ms-auto" mat-raised-button color="primary" (click)="add()">
        Add <mat-icon>add_circle_outline</mat-icon>
      </button>
    </div>
  </div>
  <div class="d-flex justify-content-end row">
    <mat-form-field>
      <mat-label>Filter</mat-label>
      <input
        matInput
        (keyup)="applyFilter($event)"
        placeholder="Search"
        #input
      />
    </mat-form-field>
  </div>
  <div class="mat-elevation-z8 py-5">
    <table
      mat-table
      [dataSource]="dataSource"
      matSort
      matSortActive="created"
      matSortDisableClear
      matSortDirection="desc"
    >
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let element" class="text-capitalize">
          {{ element.first_name }} {{ element.last_name }}
        </td>
      </ng-container>
      <!-- mobileColumn -->
      <ng-container matColumnDef="phone">
        <th mat-header-cell *matHeaderCellDef>Mobile</th>
        <td mat-cell *matCellDef="let element">{{ element.phone }}</td>
      </ng-container>
      <!-- Email Column -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let element">{{ element.email }}</td>
      </ng-container>
      <ng-container matColumnDef="activate">
        <th mat-header-cell *matHeaderCellDef>Copy Link</th>
        <td mat-cell *matCellDef="let element">
          <ng-container *ngIf="element.activation_link; else defaultValue">
            <!-- {{ element.activation_link }} -->
            <button
              matTooltip="Copy this link and share with user to activate their account."
              mat-icon-button
              [cdkCopyToClipboard]="element.activation_link"
            >
              <mat-icon>file_copy</mat-icon>
            </button>
          </ng-container>
        </td>
      </ng-container>
      <ng-template #defaultValue> Activated user </ng-template>

      <!-- Data actions -->
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>Action</th>
        <td mat-cell *matCellDef="let element">
          <button matTooltip="Edit entry" mat-icon-button (click)="edit(element)">
            <mat-icon color="primary">create</mat-icon>
          </button>
          <button matTooltip="Delete entry" mat-icon-button (click)="delete(element.id)">
            <mat-icon color="warn">delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <!-- Table columns and rows -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    <mat-paginator
      [length]="resultsLength"
      [pageSizeOptions]="[10, 25, 50]"
      aria-label="Select page of results"
    ></mat-paginator>
  </div>
</div>
