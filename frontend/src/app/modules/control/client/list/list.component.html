<mat-drawer-container (backdropClick)="onBackdropClicked()">
  <!-- Drawer -->
  <mat-drawer mode="side" [opened]="false" [position]="'end'" [disableClose]="true" #matDrawer>
    <router-outlet></router-outlet>
  </mat-drawer>
  <mat-drawer-content>
    <!-- header -->
    <header class="d-flex p-5">
      <div class="row">
        <div>
          <div class="fs-2 fw-bolder">Clients</div>
          <div class="ms-1 fs-6 pt-2 text-secondary">
            <ng-container *ngIf="clientCount > 0">
              {{clientCount}}
            </ng-container>
            {{clientCount | i18nPlural:{
            '=0': 'No clients',
            '=1': 'client',
            'other': 'clients'
            } }}
          </div>
        </div>
        <div class="flex items-center mt-4 sm:mt-0 md:mt-4">
          <!-- Search -->
          <div class="flex-auto">
            <mat-form-field class="fuse-mat-dense fuse-mat-no-subscript fuse-mat-rounded w-full min-w-50">
              <mat-icon class="icon-size-5" matPrefix>search</mat-icon>
              <input matInput [formControl]="searchInputControl" [autocomplete]="'off'" [placeholder]="'Search contacts'">
            </mat-form-field>
          </div>
          <!-- Add contact button -->
          <button class="ml-4" mat-flat-button [color]="'primary'" (click)="createContact()">
            <mat-icon>add</mat-icon>
            <span class="ml-2 mr-1">Add</span>
          </button>
        </div>
      </div>
    </header>
    <!-- Main actions -->
    <div class="px-5">
      <ng-container *ngIf="client$ | async as clients">
        <ng-container *ngIf="clients.length; else noclients">
          <ng-container *ngFor="let client of clients; let i = index; trackBy: trackByFn">
            <!-- Group -->
            <ng-container *ngIf="i === 0 || client.name.charAt(0) !== clients[i - 1].name.charAt(0)">
              <div class="bg-light text-secondary text-uppercase fs-6 border-top border-bottom py-1">
                {{client.name.charAt(0)}}
              </div>
            </ng-container>
            <!-- client -->
            <a [ngClass]="{'hover:bg-gray-100': !selectedClient || selectedClient.id !== client.id}"
              [routerLink]="['./', client.id]">
              <div>
              </div>
              <div class="border-bottom py-2">
                <div class="text-capitalize">{{client.name}}</div>
                <div class="text-secondary">{{client.display_name}}</div>
              </div>
            </a>
          </ng-container>
        </ng-container>
      </ng-container>

      <!-- No clients -->
      <ng-template #noclients>
        <div>There are no clients!</div>
      </ng-template>
    </div>
  </mat-drawer-content>
