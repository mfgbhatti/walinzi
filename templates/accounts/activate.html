{% extends 'base.html' %}

{% load static %}
{% block title %}Activate{% endblock title %}

{% block extrastyle %}
  <link rel="stylesheet" href="{% static 'css/login.css' %}" media="screen" />
{% endblock extrastyle %}

{% block content %}
<div class="text-center">
  <div class="form-signin w-100 m-auto">
    <form method="post">
      {% csrf_token %}
      <img
      class="mb-4"
      src="https://getbootstrap.com/docs/4.0/assets/brand/bootstrap-solid.svg"
      alt=""
      width="72"
      height="57"
    />
    <h1 class="h3 mb-3 fw-normal">Please provide your password</h1>
      <div class="form-floating">
        <input
          type="password"
          name="password1"
          class="form-control"
          id="floatingInput"
          placeholder="Password"
          maxlength="50"
          required
        />
        <label for="floatingInput">Password</label>
      </div>
      <div class="form-floating">
        <input
          type="password"
          name="password2"
          class="form-control"
          id="floatingInput"
          placeholder="Password"
          maxlength="50"
          required
        />
        <label for="floatingInput">Confirm Password</label>
      </div>

      <div>
        <button
          type="submit"
          class="btn btn-primary btn-lg w-100"
          name="email_form"
        >
          Save
        </button>
        <p class="mt-5 mb-3 text-body-secondary">© 2017–2023</p>
      </div>
    </form>
  </div>
</div>
{% endblock content %}
