{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Meta tags -->
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
      name="viewport"
    />
    <meta name="viewport" content="width=device-width" />

    <!-- Favicon and title -->
    {% comment %}
    <link rel="icon" href="path/to/fav.png" />
    {% endcomment %}
    <title>Walinzi - Activate account</title>

    <!-- Halfmoon CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/halfmoon@1.1.1/css/halfmoon-variables.min.css"
      rel="stylesheet"
    />
    <!-- Google fonts: Poppins-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Base css-->
    <link href="{% static 'css/base.css' %}" rel="stylesheet" />
  </head>
  <body data-dm-shortcut-enabled="true" data-set-preferred-mode-onload="true">
    <!-- Page wrapper start -->
    <div class="page-wrapper">
      <!-- Content wrapper start -->
      <div class="content-wrapper">
        <div class="d-flex justify-content-center align-items-center h-full">
          <div class="w-400 m-auto">
            {% if error_msg %}
            <div class="alert alert-danger" role="alert">
              <h4 class="alert-heading">{{error_msg_heading}}</h4>
              {{error_msg}}
            </div>
            {% endif %}
            <h5>Activate your account</h5>
            <form method="post">
              {% csrf_token %}
              <div class="form-group">
                <label for="password1" class="required">Password</label>
                <input
                  type="password"
                  name="password1"
                  class="form-control"
                  id="password1"
                  placeholder="Password"
                  maxlength="50"
                  required
                />
              </div>
              <div class="form-group">
                <label for="password2" class="required">Confirm Password</label>
                <input
                  type="password"
                  name="password2"
                  class="form-control"
                  id="password2"
                  placeholder="Confirm Password"
                  maxlength="50"
                  required
                />
              </div>
              <p>Please create a new strong password.</p>

              <input
                class="btn btn-primary btn-block"
                type="submit"
                name="activate_user"
                value="Save"
              />
              <p class="text-muted">Walinzi© 2017–2023</p>
            </form>
          </div>
        </div>
      </div>
      <!-- Content wrapper end -->
    </div>
    <!-- Page wrapper end -->
    <script src="https://cdn.jsdelivr.net/npm/halfmoon@1.1.1/js/halfmoon.min.js"></script>
  </body>
</html>
