<div id="info" class="tab-panel">
  <form method="post" id="profile">
    <div class="row">
      <div class="col-9">
        <h4>Info</h4>
        <div class="form-row row-eq-spacing-md">
          <div class="col-3">
            <label for="title">Title</label>
            <select class="form-control text-capitalize" name="title" id="title">
              <option value="title" selected="selected" disabled="disabled">Title</option>
              {% for title in titles %}<option value="{{ title }}">{{ title | title }}</option>{% endfor %}
            </select>
          </div>
        </div>
        <div>
          <label for="name" class="required">Name</label>
          <div class="form-row row-eq-spacing-md">
            <div class="col">
              <input type="text"
                     name="first_name"
                     class="form-control text-capitalize"
                     id="name"
                     placeholder="First name"
                     maxlength="150"
                     value="{{ user.first_name }}"
                     required />
            </div>
            <div class="col">
              <input type="text"
                     name="last_name"
                     class="form-control text-capitalize"
                     id="name"
                     placeholder="Last name"
                     maxlength="150"
                     value="{{ user.last_name }}"
                     required />
            </div>
          </div>
        </div>
        <div class="form-row row-eq-spacing-md">
          <div class="col">
            <label for="username">Username</label>
            <input type="text"
                   name="usernamr"
                   class="form-control"
                   placeholder="Username"
                   maxlength="150"
                   value="{{ user.username }}"
                   disabled="disabled" />
          </div>
          <div class="col">
            <label for="phone">Phone number</label>
            <input type="number"
                   class="form-control"
                   name="phone"
                   value="{{ user.profile.phone }}"
                   placeholder="Phone number" />
          </div>
        </div>
        <div class="form-row">
          <label for="about">About</label>
          <textarea class="form-control" placeholder="About" name="about">{{ user.profile.about }}</textarea>
        </div>
      </div>
      <div class="col-3">
        <div class="d-flex flex-column">
          <h4 class="align-self-center">Avatar</h4>
          <div class="align-self-center">
            {% comment %} djlint:off H006 {% endcomment %}
            {% if user.profile.avatar %}
              <img class="img-fluid rounded"
                   src="/media/{{ user.profile.avatar }}"
                   alt="avatar" />
            {% else %}
            <i class="fa fa-user-circle fa-5x" aria-hidden="true"></i>
            {% endif %}
          </div>
          <div class="custom-file mt-20 align-self-center">
            <input type="file"
                   id="avatarInput"
                   accept="image/png, image/jpeg, image/jpg" />
            <label for="avatarInput">
              {% if user.profile.avatar %}
                Change
              {% else %}
                Avatar
              {% endif %}
            </label>
          </div>
        </div>
        {% comment %} <img class="d-none" id="avatarPreview" src="#" alt="hidden_avatar">
        <input id="avatarDataURL" type="hidden" name="demi_avatar"> {% endcomment %}
      </div>
    </div>
    <div class="text-right mt-20">
      <button class="btn btn-primary"
              data-dismiss="modal"
              type="submit"
              name="user_info"
              id="save"
              disabled>Save</button>
    </div>
  </form>
</div>
