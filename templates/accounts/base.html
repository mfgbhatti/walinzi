<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta tags -->
    <meta charset="utf-8"/>
    <meta name="keywords" content="foo,bar"/>
    <meta name="description" content="foo"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
          name="viewport"/>
    <meta name="viewport" content="width=device-width"/>
    <!-- Favicon and title -->
    {% comment %}
    <link rel="icon" href="path/to/fav.png" />
    {% endcomment %}
    <title>Walinzi -
        {% block title %}
        {% endblock title %}
    </title>
    <!-- Google fonts: Poppins-->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap"
          rel="stylesheet"/>
    {% load static %}
    <!-- Halfmoon CSS -->
    <link rel="stylesheet"
          href="{% static 'vendors/halfmoon-1.1.1/css/halfmoon-variables.min.css' %}"/>
    <!-- Base css-->
    <link rel="stylesheet" href="{% static 'css/base.css' %}"/>
</head>separate signals, small format changes,
<body data-dm-shortcut-enabled="true" data-set-preferred-mode-onload="true">
<!-- Page wrapper start -->
<div class="page-wrapper">
    <!-- Content wrapper start -->
    <div class="content-wrapper">
        {% block content %}
        {% endblock content %}
    </div>
    <!-- Content wrapper end -->
</div>
<!-- Page wrapper end -->
<script src="{% static 'vendors/halfmoon-1.1.1/js/halfmoon.min.js' %}"></script>
</body>
</html>
