{% load static %}

<div class="col-6 mt-4 mb-4">
  <div class="d-flex justify-content-between">
    <h3>Site Phone Numbers</h3>
    <!-- phone offcanvas-->
    <button
      class="btn basic"
      type="button"
      data-bs-toggle="offcanvas"
      data-bs-target="#phone_offcanvas"
      aria-controls="phone_offcanvas"
    >
      <img src="{% static 'icons/edit.svg' %}" alt="Edit">
    </button>
  </div>

  <div
    class="offcanvas offcanvas-end"
    tabindex="-1"
    id="phone_offcanvas"
    aria-labelledby="phone_offcanvas_label"
  >
    <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="phone_offcanvas_label">
        Add Phone Numbers
      </h5>
      <button
        type="button"
        class="btn-close text-reset"
        data-bs-dismiss="offcanvas"
        aria-label="Close"
      ></button>
    </div>
    <div class="offcanvas-body small">
      <form method="post">
        {% csrf_token %}
        <div class="form-floating mb-2">
          <input
            type="text"
            name="title"
            class="form-control text-capitalize"
            id="floatingInput"
            placeholder="Title"
            maxlength="15"
            required
          />
          <label for="floatingInput">{{ phone_form.title.label_tag }}</label>
        </div>
        <div class="form-floating mb-2">
          <input
            type="number"
            name="phone"
            class="form-control"
            id="floatingInput"
            placeholder="Phone Number"
            maxlength="15"
            required
          />
          <label for="floatingInput">{{ phone_form.phone.label_tag }}</label>
        </div>
        <input
          type="hidden"
          name="site"
          value="{{ site.id }}"
          id="site"
        />
        <div>
          <button
            type="submit"
            class="btn btn-primary btn-lg w-100"
            name="phone_form"
          >
            Save
          </button>
        </div>
      </form>
    </div>
  </div>
  <table class="table table-striped table-sm" style="width: 100%">
    <thead>
      <tr>
        <th scope="col">#</th>
        <th scope="col">Dep</th>
        <th scope="col">Number</th>
      </tr>
    </thead>
    <tbody>
      {% for phone_number in phone_data %}
      <tr>
        <td>{{forloop.counter}}</td>
        <td class="text-capitalize">{{phone_number.title}}</td>
        <td>{{phone_number.phone}}</td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="3">No Phone Number</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
