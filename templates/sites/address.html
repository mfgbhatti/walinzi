{% load static %}
<div class="col-6">
  <div class="d-flex justify-content-between">
    <h3>Address</h3>
    <button class="btn basic"
            type="button"
            data-bs-toggle="offcanvas"
            data-bs-target="#offcanvasRight"
            aria-controls="offcanvasRight">
    </button>
  </div>
  <div>
    {% if site_address %}
      <table class="table table-striped table-sm">
        <tr>
          <th>Street:</th>
          <td class="text-capitalize">{{ site_address.street }}</td>
        </tr>
        <tr>
          <th>City:</th>
          <td class="text-capitalize">{{ site_address.city }}</td>
        </tr>
        <tr>
          <th>Post Code:</th>
          <td class="text-uppercase">{{ site_address.post_code }}</td>
        </tr>
      </table>
    {% else %}
      <p class="text-capitalize">add address</p>
    {% endif %}
  </div>
  <!-- address form -->
  <div class="offcanvas offcanvas-end"
       tabindex="-1"
       id="offcanvasRight"
       aria-labelledby="offcanvasRightLabel">
    <div class="offcanvas-header">
      <h5 id="offcanvasRightLabel">Edit Site Address</h5>
      <button type="button"
              class="btn-close text-reset"
              data-bs-dismiss="offcanvas"
              aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
      <form id="address_form" method="post">
        {% csrf_token %}
        <div class="form-floating mb-2">
          <input type="text"
                 name="street"
                 class="form-control text-capitalize"
                 id="floatingInput"
                 {% if site_address.street %}value="{{ site_address.street }}"{% endif %}
                 placeholder="Street"
                 maxlength="150"
                 required />
          <label for="floatingInput">{{ address_form.street.label_tag }}</label>
        </div>
        <div class="form-floating mb-2">
          <input type="text"
                 name="city"
                 class="form-control text-capitalize"
                 id="floatingInput"
                 {% if site_address.city %}value="{{ site_address.city }}"{% endif %}
                 placeholder="City"
                 maxlength="150"
                 required />
          <label for="floatingInput">{{ address_form.city.label_tag }}</label>
        </div>
        <div class="form-floating mb-2">
          <input type="text"
                 name="post_code"
                 class="form-control text-uppercase"
                 id="floatingInput"
                 {% if site_address.post_code %}value="{{ site_address.post_code }}"{% endif %}
                 placeholder="Post Code"
                 maxlength="15"
                 required />
          <label for="floatingInput">{{ address_form.post_code.label_tag }}</label>
        </div>
        <input type="hidden" name="site" value="{{ site.id }}" id="site" />
        <div>
          <button type="submit"
                  class="btn btn-primary btn-lg w-100"
                  name="address_form">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
