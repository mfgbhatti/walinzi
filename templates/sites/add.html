<!-- Add site modal start-->
<div class="modal"
     id="add_site_modal"
     tabindex="-1"
     role="dialog"
     data-overlay-dismissal-disabled="true"
     data-esc-dismissal-disabled="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <a href="#"
         class="close"
         role="button"
         data-dismiss="modal"
         aria-label="Close">
        <span aria-hidden="true">×</span>
      </a>
      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label for="site-name" class="required">{{ form.name.label }}</label>
          <input type="text"
                 name="name"
                 class="form-control text-capitalize"
                 id="site-name"
                 placeholder="Name"
                 maxlength="150"
                 required />
        </div>
        <!-- Select box -->
        <div class="form-group">
          <label for="site-name" class="required">Your client</label>
          <select class="form-control" id="client" name="client">
            <option value="" selected="selected" disabled="disabled">Select a client</option>
            {% for client in clients %}<option value="{{ client.id }}">{{ client.name|title }}</option>{% endfor %}
          </select>
        </div>
        <div class="text-right mt-20">
          <!-- text-right = text-align: right, mt-20 = margin-top: 2rem (20px) -->
          <button class="btn mr-5" data-dismiss="modal" type="button">Close</button>
          <button class="btn btn-primary"
                  data-dismiss="modal"
                  type="submit"
                  name="save_site">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
<!-- Add site modal end-->
