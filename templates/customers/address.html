{% load static %}
<div class="col-6">
  <div class="d-flex justify-content-between">
    <h3>Address</h3>
    <button
      class="btn basic"
      type="button"
      data-bs-toggle="offcanvas"
      data-bs-target="#offcanvasRight"
      aria-controls="offcanvasRight"
    >
      <img src="{% static 'icons/edit.svg' %}" alt="edit" />
    </button>
  </div>
  <div>
    {% if customer_address %}
    <table class="table table-striped table-sm" style="width: 100%">
      <tr>
        <th>Street:</th>
        <td class="text-capitalize">{{customer_address.street}}</td>
      </tr>
      <tr>
        <th>City:</th>
        <td class="text-capitalize">{{customer_address.city}}</td>
      </tr>
      <tr>
        <th>Post Code:</th>
        <td class="text-uppercase">{{customer_address.post_code}}</td>
      </tr>
    </table>
    {% else %}
    <p class="text-capitalize">add address</p>
    {% endif %}
  </div>
  <!-- address form -->

  <div
    class="offcanvas offcanvas-end"
    tabindex="-1"
    id="offcanvasRight"
    aria-labelledby="offcanvasRightLabel"
  >
    <div class="offcanvas-header">
      <h5 id="offcanvasRightLabel">Edit Customer Address</h5>
      <button
        type="button"
        class="btn-close text-reset"
        data-bs-dismiss="offcanvas"
        aria-label="Close"
      ></button>
    </div>
    <div class="offcanvas-body">
      <form id="address_form" method="post">
        {% csrf_token %}
        <div class="form-floating mb-2">
          <input
            type="text"
            name="street"
            class="form-control text-capitalize"
            id="floatingInput"
            {% if customer_address.street %}
            value="{{customer_address.street}}"
            {% endif %}
            placeholder="Street"
            maxlength="150"
            required
          />
          <label for="floatingInput"
            >{{ address_form.street.label_tag }}</label
          >
        </div>
        <div class="form-floating mb-2">
          <input
            type="text"
            name="city"
            class="form-control text-capitalize"
            id="floatingInput"
            {% if customer_address.city %}
            value="{{customer_address.city}}"
            {% endif %}
            placeholder="City"
            maxlength="150"
            required
          />
          <label for="floatingInput">{{ address_form.city.label_tag }}</label>
        </div>
        <div class="form-floating mb-2">
          <input
            type="text"
            name="post_code"
            class="form-control text-uppercase"
            id="floatingInput"
            {% if customer_address.post_code %}
            value="{{customer_address.post_code}}"
            {% endif %}
            placeholder="Post Code"
            maxlength="15"
            required
          />
          <label for="floatingInput"
            >{{ address_form.post_code.label_tag }}</label
          >
        </div>
        <input
          type="hidden"
          name="customer"
          value="{{ customer.id }}"
          id="customer"
        />
        <div>
          <button
            type="submit"
            class="btn btn-primary btn-lg w-100"
            name="address_form"
          >
            Save
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
