{% load static %}
<div class="col-6">
  <div class="d-flex justify-content-between">
    <h3>Details</h3>
    <button
      class="btn basic"
      type="button"
      data-bs-toggle="offcanvas"
      data-bs-target="#customer_details"
      aria-controls="customer_details"
    >
      <img src="{% static 'icons/edit.svg' %}" alt="" />
    </button>
  </div>
  <div>
    {% if customer_details %}
    <table class="table table-striped table-sm" style="width: 100%">
      <tr>
        <th>Website:</th>
        <td>{{customer_details.website}}</td>
      </tr>
      <tr>
        <th>VAT:</th>
        <td>{{customer_details.vat_number}}</td>
      </tr>
      <tr>
        <th>Logo:</th>
        <td>{{customer_details.logo}}</td>
      </tr>
    </table>
    {% else %}
    <p class="text-capitalize">add details</p>
    {% endif %}
  </div>
  <!-- details form -->

  <div
    class="offcanvas offcanvas-end"
    tabindex="-1"
    id="customer_details"
    aria-labelledby="customer_details_label"
  >
    <div class="offcanvas-header">
      <h5 id="customer_details_label">Edit Customer Details</h5>
      <button
        type="button"
        class="btn-close text-reset"
        data-bs-dismiss="offcanvas"
        aria-label="Close"
      ></button>
    </div>
    <div class="offcanvas-body">
      <form id="detail_form" method="post">
        {% csrf_token %}
        <div class="form-floating mb-2">
          <input
            type="url"
            name="website"
            class="form-control"
            id="floatingInput"
            {% if customer_details.website %}
            value="{{customer_details.website}}"
            {% endif %}
            placeholder="Website"
            maxlength="100"
            required
          />
          <label for="floatingInput"
            >{{ detail_form.website.label_tag }}</label
          >
        </div>
        <div class="form-floating mb-2">
          <input
            type="text"
            name="vat_number"
            class="form-control"
            id="floatingInput"
            {% if customer_details.vat_number %}
            value="{{customer_details.vat_number}}"
            {% endif %}
            placeholder="VAT"
            maxlength="12"
            required
          />
          <label for="floatingInput"
            >{{ detail_form.vat_number.label_tag }}</label
          >
        </div>
        <div class="form-floating mb-2">
          <input
            type="text"
            name="logo"
            class="form-control"
            id="floatingInput"
            {% if customer_details.logo %}
            value="{{customer_details.logo}}"
            {% endif %}
            placeholder="Logo"
            maxlength="100"
            required
          />
          <label for="floatingInput">{{ detail_form.logo.label_tag }}</label>
        </div>
        <input
          type="hidden"
          name="customer"
          value="{{ customer.id }}"
          id="customer"
        />
        <div>
          <button
            type="submit"
            class="btn btn-primary btn-lg w-100"
            name="detail_form"
          >
            Save
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
