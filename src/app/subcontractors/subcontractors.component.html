<div class="d-flex justify-content-end mt-4 mb-4">
  <div><button mat-raised-button color="primary" (click)="addSubcontractor()">Add</button></div>
  <div class="ms-4"><button class="page-btn-edit" mat-raised-button color="primary" (click)="updateSubcontractor()"
      [disabled]="!this.isSelected">
      Edit
    </button></div>
</div>
<app-sub-list [input$]="allSub$" (compEmitter)="selectSubcontractor($event)" (toggler)="updateStatus($event)">
</app-sub-list>
