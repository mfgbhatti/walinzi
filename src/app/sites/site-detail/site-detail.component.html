<div class="mt-4" *ngFor="let site of site$">
  <div>
    <h1>{{site.name}}</h1>
    <p><b>Address:</b>&nbsp;{{site.address}},&nbsp;{{site.post_code}}</p>
  </div>
  <div class="d-flex">
    <p><b>Client:</b>&nbsp;{{site.clientName}}</p>
    <p class="ms-2"><b>Created By:</b>&nbsp;Name</p>
  </div>
</div>
<mat-tab-group class="mt-4">
  <mat-tab label="Information">
    <app-site-tab-info [clientId$]="clientId" [siteId$]="siteId"></app-site-tab-info>
  </mat-tab>
  <mat-tab label="Extra Details">
    <app-site-tab-extra [siteId$]="siteId"></app-site-tab-extra>
  </mat-tab>
  <mat-tab label="Notes">
    <app-site-tab-notes [siteId$]="siteId"></app-site-tab-notes>
  </mat-tab>
  <mat-tab label="Rate Card">
    <app-site-tab-rate [siteId$]="siteId"></app-site-tab-rate>
  </mat-tab>
  <mat-tab label="Documents">
    <app-site-tab-docs></app-site-tab-docs>
  </mat-tab>
  <mat-tab label="Preferred Staff">
    <app-site-tab-staff></app-site-tab-staff>
  </mat-tab>
  <mat-tab label="Timesheet">
    <app-site-tab-timesheet></app-site-tab-timesheet>
  </mat-tab>
</mat-tab-group>
