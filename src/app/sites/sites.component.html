<div class="d-flex justify-content-end mt-4 mb-4">
  <div><button mat-raised-button color="primary" (click)="addSite()">Add</button></div>
  <div class="ms-4"><button class="page-btn-edit" mat-raised-button color="primary" (click)="updateSite()"
      [disabled]="!this.isSelected">
      Edit
    </button></div>
</div>
<app-site-list [site$]="allSite$" (siteEmitter)="selectSite($event)"
  (toggler)="updateStatus($event)"></app-site-list>
