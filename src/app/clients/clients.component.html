<div class="d-flex justify-content-end mt-4 mb-4">
    <div><button class="btn" mat-raised-button color="primary" (click)="addClient()">Add</button></div>
    <div class="ms-4"><button class="btn" mat-raised-button color="primary" (click)="updateClient()" [disabled]="!this.isSelected">Edit</button></div>
</div>
<app-clients-list
  [client$]="allClient$"
  (clientsEmitter)="selectClient($event)"
  (toggler)="updateStatus($event)"
></app-clients-list>
