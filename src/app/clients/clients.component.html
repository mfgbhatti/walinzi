<div class="page-container">
  <div class="page-to-right">
    <button mat-raised-button color="primary" (click)="addClient()">
      Add
    </button>
    <button class="page-btn-edit" mat-raised-button color="primary" (click)="updateClient()" [disabled]="!this.isSelected">
      Edit
    </button>
  </div>
  <app-clients-list
    [client$]="allClient$"
    (clientsEmitter)="selectClient($event)"
    (toggler)="updateStatus($event)"
  ></app-clients-list>
</div>
