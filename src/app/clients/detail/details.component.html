<div class="mt-4" *ngFor="let client of client$">
  <div class="d-fleclient">
    <h1 class="teclientt-capitalize">{{client.name}}</h1>
    <a class="ms-4 teclientt-lowercase" href="mailto:{{client.email}}">
      <mat-icon>email</mat-icon>
    </a>
    <a class="ms-2" href="tel:{{client.phone}}">
      <mat-icon>call</mat-icon>
    </a>
  </div>
  <div class="d-fleclient">
    <h4 class="teclientt-capitalize">{{client.name}}</h4>
    <div class="detail-divider">&nbsp;</div>
    <div><span class="teclientt-capitalize">{{client.address}}</span>,&nbsp;<span class="teclientt-capitalize">{{client.city}}</span>,&nbsp;<span class="teclientt-uppercase">{{client.post_code}}</span></div>
  </div>
</div>
<mat-tab-group mat-align-tabs="start">
  <mat-tab label="Details">
    <app-client-detail [clientId$]="clientId"></app-client-detail>
  </mat-tab>
  <mat-tab label="Notes">
    <app-client-note [clientId$]="clientId"></app-client-note>
  </mat-tab>
  <mat-tab label="Sites">
    <app-client-details-sites [clientId$]="clientId"></app-client-details-sites>
  </mat-tab>
  <mat-tab label="Timesheets">Content 3</mat-tab>
</mat-tab-group>
