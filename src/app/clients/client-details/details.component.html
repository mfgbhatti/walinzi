<div class="mt-4" *ngFor="let x of client">
  <div class="d-flex">
    <h1>{{x.name}}</h1>
    <a class="ms-4" href="mailto:{{x.email}}">
      <mat-icon>email</mat-icon>
    </a>
    <a class="ms-2" href="tel:{{x.phone}}">
      <mat-icon> call</mat-icon>
    </a>
  </div>
  <div class="d-flex">
    <h4>{{x.name}}</h4>
    <div class="detail-divider">&nbsp;</div>
    <div>{{x.first_line}},&nbsp;{{x.second_line}},&nbsp;{{x.post_code}}</div>

  </div>
</div>
<mat-tab-group mat-align-tabs="start">
  <mat-tab label="Details">
    <app-client-detail [clientId$]="clientId"></app-client-detail>
  </mat-tab>
  <mat-tab label="Notes">
    <app-client-note [clientId$]="clientId"></app-client-note>
  </mat-tab>
  <mat-tab label="Sites">
    <app-client-details-sites></app-client-details-sites>
  </mat-tab>
  <mat-tab label="Timesheets">Content 3</mat-tab>
</mat-tab-group>
