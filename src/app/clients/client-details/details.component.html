<div class="client-details" *ngFor="let x of client">
  <div class="top">
    <span class="name">{{x.name}}</span>
    <span class="email">
      <a href="mailto:{{x.email}}">
        <mat-icon>email</mat-icon>
      </a>
    </span>
    <span class="phone">
      <a href="tel:{{x.phone}}">
        <mat-icon> call</mat-icon>
      </a>
    </span>
  </div>
  <div class="bottom">
    <span class="small-name">{{x.name}}</span>
    <span class="divider">&nbsp;</span>
    <span class="address">{{x.first_line}},&nbsp;{{x.second_line}},&nbsp;{{x.post_code}}</span>

  </div>
</div>
<mat-tab-group mat-align-tabs="start">
  <mat-tab label="Details">
    <app-client-detail [clientId$]="clientId"></app-client-detail>
  </mat-tab>
  <mat-tab label="Notes">
    <app-client-note [clientId]="clientId"></app-client-note>
  </mat-tab>
  <mat-tab label="Sites">
    <app-client-details-sites></app-client-details-sites>
  </mat-tab>
  <mat-tab label="Timesheets">Content 3</mat-tab>
</mat-tab-group>
