<div class="d-flex justify-content-end mt-4 mb-4">
  <div><button mat-raised-button color="primary" (click)="add()">Add</button></div>
  <div class="ms-4"><button class="page-btn-edit" mat-raised-button color="primary" (click)="update()"
      [disabled]="!this.isSelected">
      Edit
    </button></div>
</div>
<app-site-list [site$]="site$" [client$]="client$" (siteEmitter)="selectSite($event)" (statustoggler)="updateStatus($event)"></app-site-list>
