<form [formGroup]="form" class="row">
  <mat-form-field appearance="fill">
    <mat-label>Select Type</mat-label>
    <mat-select formControlName="type" name="Type">
      <mat-option *ngFor="let type of rateType" value="{{type}}">
        {{type}}
      </mat-option>
    </mat-select>
  </mat-form-field>
  <mat-form-field>
    <mat-label>Rate</mat-label>
    <input required formControlName="charged_rate" placeholder="13.50" type="number" matInput />
  </mat-form-field>
  <div class="d-flex justify-content-end">
    <button type="button" mat-raised-button (click)="submit()" color="primary" class="btn submit col-3"
      [disabled]="!this.form.valid">
      Submit
    </button>
    <button type="button" mat-raised-button (click)="close()" color="accent" class="btn submit col-3 ms-4">
      Close
    </button>
  </div>
</form>
