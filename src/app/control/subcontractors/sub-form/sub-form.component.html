<form [formGroup]="form" class="row">
  <mat-form-field class="col">
    <mat-label class="form-label">Name</mat-label>
    <input matInput required formControlName="name" placeholder="Abc Xyz limited" type="text" class="text-capitalize"/>
  </mat-form-field>
  <mat-form-field>
    <mat-label>Short Code</mat-label>
    <input matInput required="" formControlName="short_code" placeholder="ABC AB1" type="text" style="text-transform: uppercase;" maxlength="3" />
  </mat-form-field>
  <mat-form-field>
    <mat-label>Phone</mat-label>
    <input matInput  required formControlName="phone" placeholder="0333 222 3332" type="tel" pattern="[0-9]*"/>
  </mat-form-field>
  <mat-form-field>
    <mat-label>Pay Rate</mat-label>
    <input matInput required formControlName="pay_rate" placeholder="11.00" type="number" pattern="^[0-9.]*" />
  </mat-form-field>
  <mat-form-field>
    <mat-label>Email</mat-label>
    <input matInput formControlName="email" placeholder="email@example.com" type="email"
      style="text-transform: lowercase;" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" />
  </mat-form-field>
  <mat-form-field>
    <mat-label>Address</mat-label>
    <input matInput required formControlName="first_line" placeholder="33 Sector, road, street" type="text" class="text-capitalize" />
  </mat-form-field>
  <mat-form-field>
    <mat-label>City</mat-label>
    <input matInput required formControlName="second_line" placeholder="Greater London" type="text" class="text-capitalize"/>
  </mat-form-field>
  <mat-form-field>
    <mat-label>Post Code</mat-label>
    <input matInput required formControlName="post_code" placeholder="LE12 1EE" class="text-uppercase"
      type="text" />
  </mat-form-field>
  <mat-radio-group formControlName="status" aria-labelledby="radio-group-label"
    class="col-4 d-flex justify-content-between">
    <mat-radio-button class="radio-button" *ngFor="let x of status_list;" [value]="x.status">
      {{x.label}}
    </mat-radio-button>
  </mat-radio-group>
  <div class="d-flex justify-content-end">
    <button type="button" mat-raised-button (click)="submit()" color="primary" class="btn submit col-3"
      [disabled]="!this.form.valid">
      Submit
    </button>
    <button type="button" mat-raised-button (click)="close()" color="accent" class="btn submit col-3 ms-4">
      Close
    </button>
  </div>
</form>
