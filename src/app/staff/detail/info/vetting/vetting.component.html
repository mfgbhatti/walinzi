<div class="d-flex justify-content-between">
  <h1>Vetting</h1>
  <div *ngIf="vetting$ | async as vetting;">
    <div *ngIf="vetting.length===0; then add"></div>
    <div *ngFor="let x of vetting">
      <div *ngIf="x.submitted === true; then edit"></div>
      <ng-template #edit>
        <button class="btn" mat-raised-button color="primary" (click)="editVetting(x)">
          Edit
        </button>
      </ng-template>
    </div>
    <ng-template #add>
      <div>
        <button class="btn" mat-raised-button color="primary" (click)="addDetail()">
          Add
        </button>
      </div>
    </ng-template>
  </div>
</div>
<div *ngIf="vetting$ | async as vetting;">
  <div *ngIf="vetting.length===0; then empty"></div>
  <div *ngFor="let x of vetting">
    <table class="table table-striped col">
      <tbody>
        <tr>
          <th scope="row">
            Vetting Start Date
          </th>
          <td>Empty</td>
        </tr>
        <tr>
          <th scope="row">Vetting End Date</th>
          <td>Empty</td>
        </tr>
        <tr>
          <th scope="row">Contract Start Date</th>
          <td>Empty</td>
        </tr>
        <tr>
          <th scope="row">Contract End Date</th>
          <td>Empty</td>
        </tr>
      </tbody>
    </table>
  </div>
  <ng-template #empty>
    <div class="no-record">There is no record to show.</div>
  </ng-template>
</div>
